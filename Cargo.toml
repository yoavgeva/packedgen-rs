[package]
name = "packedgen"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Packed lock-free generational hash maps for memory-dense concurrent workloads"
license = "MIT"
repository = "https://github.com/yoavgeva/packedgen-rs"
keywords = ["hashmap", "concurrent", "lock-free", "database", "cache"]
categories = ["data-structures", "database-implementations"]

[workspace]
members = [".", "crates/elastic-core"]
resolver = "3"

[features]
default = []
gxhash = ["ptr_hash/gxhash", "ph?/gxhash"]
shared-gx = ["dep:gxhash", "gxhash"]
prepared-keys = []
prepared-batch-gate = ["prepared-keys"]
operation-batch = ["prepared-batch-gate"]
cache-diagnostics = []
cache-pressure-timing = ["cache-diagnostics"]
allocation-diagnostics = []
miss-optimized-frozen = []
phast = ["dep:ph"]
kphf = []
jemalloc-probe = ["dep:tikv-jemallocator"]

[dependencies]
# Paper-derived comparison backend retained as an owned workspace crate. It is
# not the placement algorithm used by PackedGen's primary generation maps.
arc-swap = "1.9.1"
opthash = { package = "packedgen-opthash", version = "=0.1.0", path = "crates/elastic-core" }
# 2.1.1 initializes the complete remap tail reached by arbitrary non-member
# queries; older releases can perform an out-of-bounds unchecked read there.
ptr_hash = { version = "=2.1.1", default-features = false }
hashbrown = "0.17.1"
rapidhash = "=4.4.2"
gxhash = { version = "=3.5.0", optional = true }
papaya = "0.2.4"
parking_lot = "0.12"
seize = "0.5.1"
ph = { version = "=0.11.0", default-features = false, optional = true }
wide = { version = "0.7.33", default-features = false }
tikv-jemallocator = { version = "0.5.4", optional = true }

[dev-dependencies]
criterion = { version = "0.7", features = ["html_reports"] }
dashmap = "=6.2.1"
flurry = "=0.5.2"
scc = "=3.8.5"
stats_alloc = { version = "0.1.10", features = ["nightly"] }
loom = "0.7.2"

[[example]]
name = "phast_frozen_probe"
required-features = ["phast"]

[[example]]
name = "atomic_index_backend_probe"
required-features = ["phast"]

[[example]]
name = "kphf_frozen_probe"
required-features = ["kphf"]

[[example]]
name = "hash_schedule_probe"
required-features = ["gxhash"]

[[example]]
name = "prepared_key_probe"
required-features = ["prepared-keys"]

[[example]]
name = "prepared_batch_probe"
required-features = ["prepared-keys"]

[[example]]
name = "prepared_batch_rebuild_probe"
required-features = ["prepared-keys"]

[[bench]]
name = "point_ops"
harness = false

[[bench]]
name = "mixed_workloads"
harness = false

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
