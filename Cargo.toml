[package]
name = "packedgen"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A memory-dense concurrent cache with lock-free reads and S3-FIFO eviction"
license = "MIT"
repository = "https://github.com/yoavgeva/packedgen-rs"
readme = "README.md"
keywords = ["cache", "concurrent", "lock-free", "s3-fifo", "tinylfu"]
categories = ["caching", "concurrency", "data-structures"]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[workspace]
members = [".", "crates/research", "crates/elastic-core"]
# Plain cargo commands at the root build and test the research crate too.
default-members = [".", "crates/research"]
resolver = "3"

# Keep release code generation while retaining locations for allocation and
# CPU profiles. This is opt-in and does not change release/bench defaults.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"

[dependencies]
foldhash = "0.2.0"
parking_lot = "0.12"

[dev-dependencies]
loom = "0.7.2"
stats_alloc = { version = "0.1.10", features = ["nightly"] }

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

[lints]
workspace = true
