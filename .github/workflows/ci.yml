name: CI

# A pull request runs CI once, on its pull_request event; pushes run it on
# main only, and any branch can run it by hand. Branches under bench/ only
# run the benchmarks.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels the run for the commit it replaces.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  msrv:
    name: Rust 1.88 minimum version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - name: Check every PackedGen target and feature
        env:
          # gxhash deliberately refuses to compile unless the target enables
          # the AES/SSE2 instructions required by its explicit opt-in feature.
          RUSTFLAGS: -C target-cpu=native
        run: cargo check -p packedgen --all-targets --all-features
      - name: Check the paper-reference crate's stable feature set
        run: cargo check -p packedgen-opthash --all-targets
      - name: Check the no-std core as an rlib
        run: cargo rustc -p packedgen-opthash --no-default-features --lib --crate-type rlib

  test:
    name: Stable tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      # The test jobs run tests and examples under nextest, every binary at
      # once, and benches under cargo test; test-windows says why. The
      # workspace's benches take about two minutes here, so they run in
      # test-benches, with the doctests, which nextest doesn't run.
      - name: Tests
        run: cargo nextest run --no-fail-fast --workspace --lib --bins --tests --examples

  test-benches:
    name: Stable benches in test mode and doctests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-benches
      - name: Benches in test mode
        run: cargo test --workspace --benches
      # Their compile_fail examples are the only checks that PackedCache is
      # Send and Sync only for values that are, and that a value read from
      # a cache can't outlive it.
      - name: Doctests
        run: cargo test --workspace --doc

  test-features:
    name: Stable tests with every feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # These steps build with target-cpu=native. Runners differ in CPU, and
      # restoring another CPU's artifacts can run instructions this one lacks
      # (SIGILL). Runners naming the same CPU model can still expose different
      # instruction sets, so the cache is keyed by the target features rustc
      # enables here.
      - name: Native target features cache key
        id: cpu
        run: echo "features=$(rustc --print cfg -C target-cpu=native | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: features-native-${{ steps.cpu.outputs.features }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - name: Root runtime tests with every feature
        env:
          RUSTFLAGS: -C target-cpu=native
        run: cargo nextest run --no-fail-fast -p packedgen --lib --bins --tests --examples --all-features
      - name: Root benches in test mode with every feature
        env:
          RUSTFLAGS: -C target-cpu=native
        run: cargo test -p packedgen --benches --all-features

  lint:
    name: Lints, audit, and packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      # Clippy below builds with target-cpu=native; see test-features.
      - name: Native target features cache key
        id: cpu
        run: echo "features=$(rustc --print cfg -C target-cpu=native | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint-native-${{ steps.cpu.outputs.features }}
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        env:
          RUSTFLAGS: -C target-cpu=native
        run: cargo clippy -p packedgen --all-targets --all-features -- -D warnings
      - name: Clippy for the paper-reference crate
        run: cargo clippy -p packedgen-opthash --all-targets -- -D warnings
      - name: Clippy for the Python extension feature
        run: cargo clippy -p packedgen-opthash --features python --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
          fallback: none
      - name: Dependency security audit
        run: scripts/security_audit.sh
      - name: Verify publishable package chain
        run: scripts/package_release.sh

  test-macos-arm:
    name: Stable tests on Apple Silicon (${{ matrix.name }})
    # Exercise ARM's weak memory ordering independently of x86 CI.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            key: default
            features: ""
          - name: prepared keys and diagnostics
            key: prepared
            features: prepared-keys,prepared-batch-gate,cache-production-diagnostics
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.key }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - name: PackedGen tests
        run: cargo nextest run --locked --no-fail-fast -p packedgen --lib --bins --tests --examples --features "${{ matrix.features }}"
      - name: PackedGen benches in test mode
        run: cargo test --locked -p packedgen --benches --features "${{ matrix.features }}"

  test-windows:
    name: Stable tests on Windows (${{ matrix.name }})
    # Windows has neither membarrier nor madvise, so this runs the portable
    # fallbacks under Windows' scheduler, timers, and allocator.
    runs-on: windows-latest
    timeout-minutes: 30
    # cargo test runs one test binary at a time, about nine minutes here.
    # nextest runs every binary's tests at once, so the test legs take about
    # as long as their slowest test, direct_cache_memory's three minutes.
    # It runs each benchmark in its own process, though, and every Criterion
    # process repeats its bench's setup (about 16 s for mixed_workloads), so
    # the benches run under cargo test on a runner of their own.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default features
            key: default
            command: nextest run --no-fail-fast --workspace --lib --bins --tests --examples
          - name: prepared keys and diagnostics
            key: prepared
            command: >-
              nextest run --no-fail-fast -p packedgen --lib --bins --tests --examples
              --features prepared-keys,prepared-batch-gate,cache-production-diagnostics
          - name: benches in test mode
            key: benches
            command: test --workspace --benches
    defaults:
      run:
        shell: bash
    env:
      # Without debug info, the uncached build took 1m12s against 2m20s, as
      # the linker skips writing PDBs for the ~90 test, example, and bench
      # binaries. Panic messages keep their source locations.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      # Tests read sources with include_str!; keep the LF endings the other
      # runners check out.
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-${{ matrix.key }}
      - uses: taiki-e/install-action@v2
        if: startsWith(matrix.command, 'nextest')
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - name: Tests
        run: cargo ${{ matrix.command }} --locked

  loom:
    name: Loom models
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: loom
      - name: Exhaustive concurrency models
        run: cargo test --release --test cache_concurrency_model

  miri:
    name: Miri (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: focused checks
            mode: --miri-focused
            key: focused
          - name: ShardedCache 1/2
            mode: --miri-sharded
            key: sharded
            partition: slice:1/2
          - name: ShardedCache 2/2
            mode: --miri-sharded
            key: sharded
            partition: slice:2/2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri,rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: miri-${{ matrix.key }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - name: Interpreter checks
        env:
          PACKEDGEN_MIRI_PARTITION: ${{ matrix.partition }}
        run: scripts/cache_proof.sh ${{ matrix.mode }}

  sanitizers:
    name: Address and thread sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: sanitizers
      - name: Address and thread sanitizers
        run: scripts/cache_proof.sh --sanitizers

  companion-miri:
    name: Companion strict-provenance Miri (${{ matrix.share }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        share: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri,rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: companion-miri
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
          fallback: none
      - name: Strict-provenance interpreter checks
        working-directory: crates/elastic-core
        env:
          MIRI_PARTITION: slice:${{ matrix.share }}
        run: ci/miri.sh

  companion-asan:
    name: Companion address sanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: companion-asan
      - name: Address sanitizer
        working-directory: crates/elastic-core
        env:
          # The parity suite deliberately requests an impossible allocation to
          # verify fallible reserve. Let Rust observe null instead of having
          # ASan abort before the allocator can return `AllocError`.
          ASAN_OPTIONS: allocator_may_return_null=1
        run: |
          target="$(rustc +nightly -vV | awk '/^host:/ { print $2 }')"
          RUSTFLAGS="-Zsanitizer=address" RUSTDOCFLAGS="-Zsanitizer=address" \
            cargo +nightly test -Zbuild-std --target "$target"

  python-runtime:
    name: Python binding runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: python-runtime
      - name: Build the extension wheel
        working-directory: crates/elastic-core
        run: uvx maturin build --release --features python --out dist
      - name: Run Python parity and ownership tests
        working-directory: crates/elastic-core
        run: |
          uv venv --python 3.13
          uv pip install dist/*.whl pytest hypothesis pytest-benchmark
          .venv/bin/pytest tests/python/
