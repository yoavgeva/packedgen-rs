name: TSan experiment

on:
  push:
    branches: ['bench/tsan-exp']

permissions:
  contents: read

jobs:
  tsan:
    name: TSan ${{ matrix.variant }} (${{ matrix.tests }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: baseline, cfg: "", tests: all }
          - { variant: acq-gen, cfg: "--cfg packedgen_exp_acq_gen", tests: all }
          - { variant: rmw-words, cfg: "--cfg packedgen_exp_rmw_words", tests: all }
          - { variant: acq-gen-rmw-words, cfg: "--cfg packedgen_exp_acq_gen --cfg packedgen_exp_rmw_words", tests: all }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: Runs
        env:
          TSAN_OPTIONS: history_size=7
          RUSTFLAGS: -Zsanitizer=thread --cfg packedgen_sanitize_thread ${{ matrix.cfg }}
          RUSTDOCFLAGS: -Zsanitizer=thread --cfg packedgen_sanitize_thread ${{ matrix.cfg }}
        run: |
          lscpu | grep -E 'Model name|^CPU\(s\)'
          if [ "${{ matrix.tests }}" = all ]; then
            tests="sharded_cache::tests::racing sharded_cache::tests::concurrent sharded_cache::tests::get_or_insert_with sharded_cache::tests::a_failed sharded_cache::tests::a_thread_that_exits sharded_cache::tests::dropping_a_cache sharded_cache::tests::other_writers_drain sharded_cache::tests::loads_racing sharded_cache::tests::async_and_blocking sharded_cache::tests::callers_wait sharded_cache::model_check::owners_racing"
          else
            tests="sharded_cache::model_check::owners_racing"
          fi
          for run in 1 2 3; do
            cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --lib -- $tests > run$run.log 2>&1 || true
            races=$(grep -c 'WARNING: ThreadSanitizer' run$run.log || true)
            echo "run $run: $races races; $(grep 'test result' run$run.log)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: tsan-${{ matrix.variant }}
          path: run*.log
